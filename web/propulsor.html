<title>PROPULSOR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: o jogo ocupa a tela inteira; menus são painéis sobre a cena da fábrica. Visual único (noturno), sem tema claro. */
:root {
  --deep: #1b1f3b;
  --panel: #2b3163;
  --panel-2: #353c76;
  --teal: #2ec4b6;
  --orange: #ff9f1c;
  --gold: #ffd23f;
  --red: #e71d36;
  --cyan: #7df9ff;
  --text: #f6f7fb;
  --dim: #a8aec9;
  --ok: #6bcb77;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--deep);
  color: var(--text);
  font-family: var(--body);
  font-weight: 700;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

.layer {
  position: absolute; inset: 0;
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.layer > * { pointer-events: auto; }

/* HUD */
#hud { display: flex; justify-content: space-between; align-items: flex-start; }
#hud .read { display: grid; gap: 2px; pointer-events: none; }
#dist { font-family: var(--display); font-size: clamp(32px, 6vw, 56px); line-height: 1; letter-spacing: .5px;
        font-variant-numeric: tabular-nums; text-shadow: 0 3px 0 var(--deep); }
#dist.record { color: var(--gold); }
#best { color: var(--dim); font-size: 14px; }
#coins { font-family: var(--display); color: var(--gold); font-size: 24px; font-variant-numeric: tabular-nums;
         text-shadow: 0 2px 0 var(--deep); display: flex; align-items: center; gap: 6px; }
#coins i { width: 18px; height: 18px; display: inline-block; background: var(--gold);
           clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%); position: relative; }
#hudRight { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
#popup { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
         background: var(--panel); border-radius: 14px; padding: 10px 18px; font-size: 16px; white-space: nowrap;
         box-shadow: 0 6px 0 rgba(0,0,0,.35); transition: opacity .25s, transform .25s; pointer-events: none; }
#popup[data-on="0"] { opacity: 0; transform: translateX(-50%) translateY(16px); }
#countdown { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display);
             font-size: 140px; text-shadow: 0 6px 0 var(--deep); pointer-events: none; }

/* Botões */
button {
  font-family: var(--display); font-size: 20px; letter-spacing: .5px; color: var(--text);
  background: var(--panel-2); border: 0; border-radius: 999px; padding: 12px 22px;
  box-shadow: 0 6px 0 rgba(0,0,0,.4); cursor: pointer; transition: transform .06s, box-shadow .06s;
  min-height: 48px;
}
button:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(0,0,0,.4); }
button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
button:disabled { opacity: .4; cursor: default; transform: none; }
button.primary { background: var(--orange); }
button.teal { background: var(--teal); color: var(--deep); }
button.danger { background: var(--red); }
button.icon { width: 52px; height: 52px; padding: 0; font-size: 22px; }
button.small { font-size: 15px; padding: 8px 14px; min-height: 40px; }

/* Menu principal */
#menu > *, #menu .top > * { pointer-events: none; }
#menu button { pointer-events: auto; }
#menu { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr auto; gap: 12px; }
#menu .top { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.wallet { font-family: var(--display); color: var(--gold); font-size: 20px; text-shadow: 0 2px 0 var(--deep);
          display: flex; gap: 14px; flex-wrap: wrap; justify-content: flex-end; font-variant-numeric: tabular-nums; }
.wallet .tok { color: #c8a6ff; }
#menu .brand { align-self: center; display: grid; gap: 6px; min-width: 0; }
.logo { font-family: var(--display); font-size: clamp(44px, 10vw, 96px); line-height: .9; color: var(--teal);
        text-shadow: 0 6px 0 var(--deep), 0 0 30px rgba(46,196,182,.35); letter-spacing: 1px; }
.tag { color: var(--dim); font-size: 15px; max-width: 34ch; }
#menuBest { font-size: 17px; }
#menu .side { align-self: center; display: grid; gap: 12px; }
#menu .cta { grid-column: 1 / -1; text-align: center; font-family: var(--display); font-size: clamp(20px, 4vw, 30px);
             text-shadow: 0 3px 0 var(--deep); animation: pulse 1.2s ease-in-out infinite; pointer-events: none; }
@keyframes pulse { 50% { transform: scale(1.06); } }

/* Painéis modais */
.modal { display: grid; place-items: center; background: rgba(15,17,34,.72); }
.card {
  background: var(--panel); border-radius: 24px; padding: 22px; width: min(640px, 100%);
  max-height: 100%; overflow: auto; display: grid; gap: 14px; box-shadow: 0 10px 0 rgba(0,0,0,.35);
}
.card h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 34px; text-wrap: balance; }
.card .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.card p { margin: 0; color: var(--dim); }
.list { display: grid; gap: 8px; }
.mission { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
           background: var(--deep); border-radius: 14px; padding: 10px 12px; }
.mission .stars { color: var(--gold); letter-spacing: 1px; font-size: 15px; }
.mission .txt { min-width: 0; font-size: 15px; }
.mission .prog { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
.mission.done .txt { color: var(--ok); }
.bar { height: 12px; background: var(--deep); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--gold); width: 0; transition: width .4s; }
.big { font-family: var(--display); font-size: 64px; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
.lines { display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
.lines div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed rgba(168,174,201,.25); padding: 4px 0; }
.lines .total { color: var(--gold); font-family: var(--display); font-size: 22px; border: 0; }

/* Oficina */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { font-size: 15px; padding: 8px 14px; min-height: 40px; background: var(--deep); }
.tabs button[aria-selected="true"] { background: var(--teal); color: var(--deep); }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.item { background: var(--deep); border-radius: 16px; padding: 12px; display: grid; gap: 6px; align-content: start; }
.item .sw { width: 36px; height: 36px; border-radius: 10px; }
.item b { font-size: 15px; }
.item small { color: var(--dim); font-size: 12.5px; line-height: 1.3; }
.item .state { font-size: 13px; color: var(--gold); }
.slots { font-size: 13px; color: var(--dim); }

/* Garra */
#clawBox { position: relative; height: 150px; background: var(--deep); border-radius: 18px; overflow: hidden; }
#clawArm { position: absolute; left: 50%; top: 0; width: 6px; background: var(--dim); transform: translateX(-50%); height: 30px; transition: height .45s ease-in-out; }
#clawArm::after { content: ""; position: absolute; left: 50%; bottom: -14px; width: 46px; height: 16px; transform: translateX(-50%);
                  border: 5px solid var(--dim); border-top: 0; border-radius: 0 0 14px 14px; }
#clawBelt { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: space-around; }
#clawBelt i { width: 34px; height: 34px; border-radius: 10px; display: block; }
#clawResult { text-align: center; font-family: var(--display); font-size: 24px; color: var(--gold); min-height: 30px; }

.hidden { display: none !important; }
@media (prefers-reduced-motion: reduce) { #menu .cta { animation: none; } * { transition: none !important; } }
@media (max-width: 560px) {
  #menu { grid-template-columns: 1fr; }
  #menu .side { grid-auto-flow: column; justify-content: start; overflow-x: auto; }
  .card { padding: 16px; border-radius: 18px; }
  .big { font-size: 48px; }
}
</style>

<div id="app">

  <!-- HUD -->
  <div id="hud" class="layer hidden">

    </div>
    <div class="brand">
      <div class="logo">PROPULSOR</div>

  <div id="revive" class="layer modal hidden">

  <!-- Resultados -->
  <div id="results" class="layer modal hidden">

      <div class="lines" id="rLines"></div>

      <div class="row">
        <button id="btnRShop" class="small">OFICINA</button>
        <button id="btnRMissions" class="small">MISSÕES</button>

  <!-- Oficina -->
  <div id="shop" class="layer modal hidden">

        <h2>Oficina</h2><div class="wallet"><span id="sCoins"></span></div>
      </div>

      <div class="row"><button id="btnShopClose" class="teal">VOLTAR</button></div>
    </div>
  </div>

  <!-- Missões -->
  <div id="missions" class="layer modal hidden">
    <div class="card">
      <h2>Missões</h2>
      <div id="rankName" style="font-family:var(--display);font-size:20px"></div>
      <div class="bar"><i id="rankBar"></i></div>
      <div class="list" id="missionList"></div>
      <div class="row">
        <button id="btnPrestige" class="primary hidden">TROCAR POR SELO DE PRESTÍGIO</button>
        <button id="btnMissionsClose" class="teal">VOLTAR</button>

</div>

<script>
"use strict";
/* =====================================================================
   PROPULSOR — versão web jogável do protótipo (mesmas regras do Core C#)
   ===================================================================== */

// ---------------- utilidades ----------------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * clamp(t, 0, 1);
let seed = (Date.now() & 0x7fffffff) || 1;
function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return ((seed >>> 0) % 16777216) / 16777216; }
const rr = (a, b) => a + (b - a) * rnd();
const ri = (a, b) => a + Math.floor(rnd() * (b - a)); // [a, b)
const fmt = n => Math.floor(n).toLocaleString("pt-BR");

// ---------------- física do jogador (valores [E] do doc 1·03) ----------------
const P = { g: -38, thrust: 70, up: 11, down: -14, v0: 8, acc: 0.05, vmax: 20, floor: 0, ceil: 7, h: 1,
            pop: 5, rest: 0.4, fric: 0.3, stop: 0.5, minBounce: 1 };
const MAXY = P.ceil - P.h;
const DT = 0.02;

// ---------------- trechos (mesma biblioteca do SegmentLibrary.cs) ----------------
function S(id, w, d, min = 0, bw = 1) {
  const s = { id, w, d, min, bw, zaps: [], waves: [], coins: [], slots: [] };
  s.zap = (x, y, len, ang, om = 0) => (s.zaps.push({ x, y, len, ang, om }), s);
  s.lasers = (...rows) => (s.waves.push(rows), s);
  s.line = (x0, y, n, sp = 0.6) => { for (let i = 0; i < n; i++) s.coins.push([x0 + i * sp, y]); return s; };
  s.arc = (x0, y, n, a, sp = 0.6) => { for (let i = 0; i < n; i++) { const t = n === 1 ? .5 : i / (n - 1); s.coins.push([x0 + i * sp, y + a * Math.sin(t * Math.PI)]); } return s; };
  s.slot = (x, y) => (s.slots.push([x, y]), s);
  return s;
}
const LIB = [
  S("corrida_livre", 20, 0, 0, .6).line(3, 1, 20).slot(12, 4),
  S("arco_moedas", 20, 0, 0, .6).arc(3, 2, 20, 3).slot(17, 5.5),
  S("faisca_baixa", 16, .1).zap(8, 1.5, 3, 90).line(5, 5, 8).slot(13.5, 5),
  S("faisca_alta", 16, .1).zap(8, 5.5, 3, 90).line(5, 1.2, 8).slot(13.5, 1.5),
  S("faisca_horizontal", 18, .2).zap(9, 3.5, 4, 0).line(6, 5.5, 10).line(6, 1.2, 10).slot(15.5, 3.5),
  S("portao_zigue", 20, .3, 100).zap(5, 1.5, 3, 90).zap(14, 5.5, 3, 90).arc(6, 3.6, 10, -1.5).slot(18, 2),
  S("diagonal_dupla", 22, .4, 200).zap(7, 2, 3.5, 45).zap(15, 5, 3.5, 45).line(4, 5.5, 6).line(12, 1.5, 6).slot(19.5, 3.5),
  S("escada", 24, .5, 300).zap(6, 1.5, 3, 90).zap(12, 4, 3, 0).zap(18, 5.5, 3, 90).line(4, 4.5, 4).line(13, 1.5, 10).slot(21.5, 1.5),
  S("tunel", 24, .6, 500).zap(8, 1.2, 4, 0).zap(8, 5.8, 4, 0).zap(16, 2.2, 4, 0).zap(16, 6.2, 4, 0).line(5, 3.6, 22).slot(21.5, 3.5),
  S("giratorio", 20, .5, 300).zap(10, 3.5, 3, 0, 90).line(6, 6.2, 8).slot(16.5, .5),
  S("giratorio_duplo", 26, .7, 800).zap(8, 2, 2.4, 0, 120).zap(18, 5, 2.4, 90, -120).line(5, 5, 6).line(15, 1.2, 6).slot(23.5, 3.5),
  S("feixes_simples", 40, .3, 200, .7).lasers(1, 6).lasers(3.5).line(4, 3.5, 30).slot(36, 3.5),
  S("feixes_alternados", 50, .6, 900, .7).lasers(.6, 2.2, 3.8).lasers(3.2, 4.8, 6.4).lasers(1, 6).line(4, 5.5, 20).slot(46, 3.5),
  S("denso", 30, .85, 1500).zap(6, 1.5, 3, 90).zap(11, 5.5, 3, 90).zap(17.5, 2, 3, 0, 100).zap(25, 5.5, 3, 90).line(8, 1.2, 4).line(15, 5.5, 5).slot(27.5, 1.5),
];

// ---------------- dificuldade (Difficulty.cs) ----------------
const D = {
  level: d => clamp(d / 3000, 0, 1),
  track: d => lerp(1.4, .6, d / 3000),
  imin: d => lerp(8, 2.5, d / 3000), imax: d => lerp(12, 5, d / 3000),
  burst: d => d < 1500 ? 0 : lerp(0, .35, (d - 1500) / 1500),
  aff: (sd, d) => Math.max(.05, 1 - Math.abs(sd - clamp(d / 3000, 0, 1)) * 1.5),
};

// ---------------- geometria ----------------
function boxDist(b, px, py) {
  const dx = Math.max(b.x0 - px, 0, px - b.x1), dy = Math.max(b.y0 - py, 0, py - b.y1);
  return Math.hypot(dx, dy);
}
const overlap = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
const ZR = 0.3, LH = 0.3;
function zapEnds(z, off, t) {
  const a = (z.ang + z.om * t) * Math.PI / 180, hx = Math.cos(a) * z.len / 2, hy = Math.sin(a) * z.len / 2, cx = z.x + off;
  return [cx - hx, z.y - hy, cx + hx, z.y + hy];
}
function capsuleHits(e, r, b) {
  const len = Math.hypot(e[2] - e[0], e[3] - e[1]), n = Math.max(1, Math.ceil(len / .05));
  for (let i = 0; i <= n; i++) { const t = i / n; if (boxDist(b, e[0] + (e[2] - e[0]) * t, e[1] + (e[3] - e[1]) * t) <= r) return true; }
  return false;
}

// ---------------- veículos (VehicleMotors.cs) ----------------
const VEH = {
  mech:   { name: "Mecha Pisão",       w: 1.4, h: 2.0, color: "#8e9aaf" },
  drone:  { name: "Drone-Asa",         w: 1.4, h: 1.2, color: "#6bcb77" },
  blink:  { name: "Cápsula Blink",     w: 1.2, h: 1.2, color: "#b388ff" },
  bike:   { name: "Moto-Trilho",       w: 1.8, h: 1.2, color: "#e71d36" },
  serpent:{ name: "Serpente-Céu",      w: 2.0, h: 1.0, color: "#ff9f1c" },
  flip:   { name: "Traje Inverso",     w: 0.6, h: 1.1, color: "#7df9ff" },
  ski:    { name: "Jet-Esqui",         w: 1.8, h: 0.9, color: "#1e90ff" },
  rig:    { name: "Guindaste Blindado",w: 1.8, h: 1.8, color: "#ffd23f" },
};
const VEH_KEYS = Object.keys(VEH);
const WATER = 2.1;
function makeVehicle(kind, y) {
  const d = VEH[kind];
  const v = { kind, w: d.w, h: d.h, y: clamp(y, 0, P.ceil - d.h), vy: 0, t: 0, hp: kind === "rig" ? 3 : 1, sign: -1, base: 0 };
  v.base = v.y;
  return v;
}
function vehTop(v) { return P.ceil - v.h; }
function integ(v, dt, ay, up, down) {
  v.vy = clamp(v.vy + ay * dt, down, up); v.y += v.vy * dt;
  if (v.y <= 0) { v.y = 0; if (v.vy < 0) v.vy = 0; }
  if (v.y >= vehTop(v)) { v.y = vehTop(v); if (v.vy > 0) v.vy = 0; }
}
function vehMult(v) { return v.kind === "bike" ? Math.min(2, 1.5 + .05 * v.t) : 1; }
function blinkAngle(v) { return 60 * Math.sin(2 * Math.PI * 1.5 * v.t); }
function stepVehicle(v, dt, held, pressed) {
  v.t += dt;
  const ground = v.y <= 0;
  switch (v.kind) {
    case "mech": if (pressed && ground) v.vy = 16; integ(v, dt, -45 * (held && v.vy < 0 ? .35 : 1), 16, -16); break;
    case "drone": integ(v, dt, -30 + (held ? 60 : 0), 9, -11); break;
    case "blink": v.vy = 0; if (pressed) { v.y = clamp(v.y + 2.5 * Math.sin(blinkAngle(v) * Math.PI / 180), 0, vehTop(v)); } break;
    case "bike": if (pressed && ground) v.vy = 14; integ(v, dt, -45, 14, -16); break;
    case "serpent": {
      v.vy = held ? -8 : 8; v.base = clamp(v.base + v.vy * dt, 0, vehTop(v));
      const wave = .4 * Math.sin(2 * Math.PI * v.t);
      v.y = clamp(v.base + (v.base >= vehTop(v) ? Math.min(0, wave) : wave), 0, vehTop(v)); break;
    }

  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);

}

function addCtr(k, v = 1) { R.ctr[k] = (R.ctr[k] || 0) + v; missionLiveCheck(); }
function setCtr(k, v) { if ((R.ctr[k] || 0) !== v) { R.ctr[k] = v; missionLiveCheck(); } }

function startHead(m) { R.head = Math.max(R.head, m); addCtr("head"); popup("ARRANCADA!"); SFX.boost(); shake(.15, .4); }

// ---------------- geração do mundo ----------------
function pickSeg(d) {
  let tot = 0; const c = [];
  for (const s of LIB) { if (s.min > d || R.recent.includes(s.id)) continue; const w = s.bw * D.aff(s.d, d); c.push([s, w]); tot += w; }
  let r = rnd() * tot, ch = c.length ? c[c.length - 1][0] : LIB[0];
  for (const [s, w] of c) { r -= w; if (r < 0) { ch = s; break; } }
  R.recent.push(ch.id); if (R.recent.length > 3) R.recent.shift();
  return ch;
}
function stream() {
  while (R.nextSegX < R.x + 60) {
    const d = R.nextSegX, def = pickSeg(d), seg = { id: R.nid++, def, x: R.nextSegX, laser: false, nearMask: 0 };
    R.segs.push(seg);
    for (const [cx, cy] of def.coins) R.picks.push({ id: R.nid++, k: "coin", x: seg.x + cx, y: cy });
    const nw = ri(0, 3);
    for (let i = 0; i < nw; i++) R.workers.push({ id: R.nid++, x: seg.x + rr(2, def.w - 2), y: 0, vx: 0, vy: 0, dir: rnd() < .5 ? -1 : 1, sp: rr(.6, 1.2), down: false, spin: 0 });
    if (def.slots.length) {
      if (d >= R.nextVeh && !R.veh) { const [sx, sy] = def.slots[0]; R.picks.push({ id: R.nid++, k: "veh", x: seg.x + sx, y: sy }); R.nextVeh = d + rr(250, 450); }
      else if (d >= R.nextTok) { const [sx, sy] = def.slots[def.slots.length - 1]; R.picks.push({ id: R.nid++, k: "tok", x: seg.x + sx, y: sy }); R.nextTok = d + rr(300, 600); }
    }
    R.nextSegX += def.w;
  }
  const behind = R.x - 25;
  R.segs = R.segs.filter(s => s.x + s.def.w >= behind);
  R.picks = R.picks.filter(p => !p.got && p.x >= behind);
  R.workers = R.workers.filter(w => w.x >= behind);
}

// ---------------- passo da simulação (50 Hz) ----------------
function step(dt, held, pressed) {
  R.t += dt;
  if (R.inv > 0) R.inv = Math.max(0, R.inv - dt);
  const prevX = R.x;
  if (dead()) { stepDead(dt); updateParts(dt); return; }

  if (R.head > 0) {
    R.vx = Math.min(R.vx + P.acc * dt, P.vmax); R.x += R.vx * 4 * dt;
    R.y = clamp(R.y + (3 - R.y) * Math.min(1, 5 * dt), 0, MAXY); R.vy = 0; R.st = "fall";
    R.head = Math.max(0, R.head - (R.x - prevX)); R.inv = Math.max(R.inv, R.head > 0 ? .1 : 1);
    if (R.head > 0 && Math.random() < .6) spark(R.x - .4, R.y + .3, "#ff9f1c", 1);
  } else if (R.veh) {
    stepVehicle(R.veh, dt, held, pressed);
    R.vx = Math.min(R.vx + P.acc * dt, P.vmax); R.x += R.vx * vehMult(R.veh) * dt;
  } else stepFoot(dt, held);

  stream();
  stepLaser(dt);
  stepMissiles(dt, R.x - prevX);
  stepPicks(dt);
  stepWorkers(dt);
  hazards();

  const m = Math.floor(R.x);
  if (m !== R.lastMeter) {
    const dm = m - R.lastMeter; R.lastMeter = m;
    setCtr("dist", m);
    if (!R.anyCoin) setCtr("nocoin", m);
    if (!R.veh && R.st === "ground") addCtr("ground", dm);
    if (!R.veh && R.takeoff >= 0) setCtr("flight", Math.max(R.ctr.flight || 0, m - R.takeoff));
    if (PF.best > 0 && m === PF.best + 1) popup("Novo recorde!");
  }
  updateParts(dt);
}

function stepFoot(dt, held) {
  R.vx = Math.min(R.vx + P.acc * dt, P.vmax); R.x += R.vx * dt;
  const g = P.g * R.cfg.grav;
  R.vy = clamp(R.vy + (g + (held ? P.thrust : 0)) * dt, P.down, P.up); R.y += R.vy * dt;
  const wasAir = R.st !== "ground";
  if (R.y <= 0) { R.y = 0; if (R.vy < 0) R.vy = 0; }
  else if (R.y >= MAXY) { R.y = MAXY; if (R.vy > 0) R.vy = 0; }
  const prev = R.st;
  R.st = held ? "thrust" : R.y <= 0 ? "ground" : "fall";
  if (prev === "ground" && R.st !== "ground") R.takeoff = Math.floor(R.x);
  if (R.st === "ground") R.takeoff = -1;
  if (wasAir && R.st === "ground") {
    if (R.cfg.bounce > 0 && !held) { R.vy = R.cfg.bounce; R.st = "fall"; R.takeoff = Math.floor(R.x); }
    tone(140, .05, "sine", .05);
  }
  if (held && Math.random() < .9) jetParticle();
}

function stepDead(dt) {
  if (R.st === "stopped") return;
  R.vy = Math.max(R.vy + P.g * dt, P.down); R.y += R.vy * dt;
  if (R.y >= MAXY) { R.y = MAXY; if (R.vy > 0) R.vy = 0; }
  if (R.y <= 0) { R.y = 0; if (R.vy < 0) { const b = -R.vy * P.rest; R.vy = b >= P.minBounce ? b : 0; } }
  if (R.y <= 0 && R.vy === 0) R.vx = Math.max(0, R.vx - P.fric * Math.abs(P.g) * dt);
  R.x += R.vx * dt;
  if (R.y <= 0 && R.vy === 0 && R.vx < P.stop) { R.vx = 0; R.st = "stopped"; onStopped(); }
}

function kill(cause) {
  if (dead()) return;
  if (R.veh) { R.y = R.veh.y; R.veh = null; }
  R.cause = cause; R.vAtDeath = R.vx; R.vy = Math.max(R.vy, 0) + P.pop; R.st = "dead";
  addCtr("death_" + cause); SFX.hit(); shake(.25, .3);
  for (const ms of R.missiles) if (ms.ph !== "fly") ms.ph = "gone";
  setState("dying");
}

function revive() {
  R.st = R.y <= 0 ? "ground" : "fall"; R.vx = R.vAtDeath || P.v0; R.vy = 0; R.cause = null; R.inv = 2; R.declined = false;
  SFX.revive(); popup("Segunda Chance!");
}

// ---------------- feixes de corte ----------------
const LT = { enter: .5, warn: 1.2, fire: 1.5, leave: .4 };
function stepLaser(dt) {
  const L = R.laser;
  if (L) {
    L.t += dt;
    const dur = LT[L.ph];
    if (L.t >= dur) {
      L.t -= dur;
      if (L.ph === "enter") L.ph = "warn";
      else if (L.ph === "warn") L.ph = "fire";
      else if (L.ph === "fire") { if (L.i + 1 < L.waves.length) { L.i++; L.ph = "warn"; } else L.ph = "leave"; }
      else { R.laser = null; if (!dead()) addCtr("lasers"); }
    }
    return;
  }
  for (const s of R.segs) {
    if (!s.def.waves.length || s.laser || R.x < s.x) continue;
    s.laser = true; R.laser = { waves: s.def.waves, i: 0, ph: "enter", t: 0 };
    for (const ms of R.missiles) if (ms.ph !== "fly") ms.ph = "gone";
    SFX.laser(); break;
  }
}

// ---------------- drones-foguete ----------------
function stepMissiles(dt, dx) {
  const d = dist(), box = playerBox(), cy = (box.y0 + box.y1) / 2;
  const blocked = !!R.laser || R.head > 0 || (R.veh && R.veh.kind === "bike");
  if (blocked) R.missiles = R.missiles.filter(m => m.ph === "fly");
  if (d >= 150) {
    if (R.mTimer < 0) R.mTimer = rr(D.imin(d), D.imax(d));
    if (!blocked) R.mTimer -= dt;
    const pending = R.missiles.some(m => m.ph !== "fly");
    if (R.mTimer <= 0 && !blocked && !pending) {
      const n = rnd() < D.burst(d) ? ri(3, 7) : 1;
      for (let i = 0; i < n; i++) {
        const off = n === 1 ? 0 : (i - (n - 1) / 2) * 1.2;
        R.missiles.push({ id: R.nid++, ph: "wait", y: clamp(cy + off, .4, P.ceil - .4), off, t: 0, delay: i * .25, track: D.track(d), x: 0, near: false });
      }
      R.mTimer = rr(D.imin(d), D.imax(d));
    }
  }
  for (const m of R.missiles) {
    m.t += dt;
    if (m.ph === "wait" && m.t >= m.delay) { m.ph = "track"; m.t = 0; SFX.warn(); }
    else if (m.ph === "track") { m.y += (clamp(cy + m.off, .4, P.ceil - .4) - m.y) * Math.min(1, 6 * dt); if (m.t >= m.track) { m.ph = "lock"; m.t = 0; } }
    else if (m.ph === "lock" && m.t >= .4) { m.ph = "fly"; m.x = R.x + 16; SFX.whoosh(); }
    else if (m.ph === "fly") { m.x += dx - 30 * dt; if (m.x < R.x - 12) m.ph = "gone"; }
  }

}
const missileBox = m => ({ x0: m.x - .45, x1: m.x + .45, y0: m.y - .175, y1: m.y + .175 });

// ---------------- coletáveis ----------------
function stepPicks(dt) {
  const b = playerBox(), cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
  for (const p of R.picks) {
    if (p.got) continue;
    if (R.cfg.magnet > 0 && p.k === "coin") {
      const dx = cx - p.x, dy = cy - p.y, dd = Math.hypot(dx, dy);
      if (dd < R.cfg.magnet && dd > 1e-4) { const s = Math.min(dd, 25 * dt); p.x += dx / dd * s; p.y += dy / dd * s; }
    }
    if (boxDist(b, p.x, p.y) > .35) continue;
    p.got = true;
    if (p.k === "coin") { R.coins += R.cfg.coinValue; R.anyCoin = true; addCtr("coins", R.cfg.coinValue); SFX.coin(); spark(p.x, p.y, "#ffd23f", 4); }
    else if (p.k === "tok") { R.tokens++; addCtr("tokens"); popup("+1 ficha"); SFX.token(); }
    else if (!R.veh) mount(VEH_KEYS[ri(0, VEH_KEYS.length)]);
    else { R.coins += 10; addCtr("coins", 10); }
  }
}
function mount(kind) {
  if (dead()) return;
  R.veh = makeVehicle(kind, R.y); R.takeoff = -1;
  addCtr("vehicles"); popup(VEH[kind].name); SFX.mount();
}

// ---------------- robôs operários ----------------
function stepWorkers(dt) {
  const b = playerBox(), thrust = !R.veh && R.head <= 0 && R.st === "thrust";
  for (const w of R.workers) {
    if (!w.down) {
      w.x += w.dir * w.sp * dt;
      const wb = { x0: w.x - .3, x1: w.x + .3, y0: 0, y1: 1 };
      const bump = overlap(wb, b);
      const blast = thrust && w.x > b.x0 - .5 && w.x < b.x1 + .1 && b.y0 > wb.y1 - .2 && b.y0 - wb.y1 < 2.5;
      if (bump || blast) { w.down = true; w.vx = bump ? R.vx * .6 + 4 : -3; w.vy = bump ? 7 : 4; addCtr("workers"); SFX.bonk(); }
      continue;
    }
    w.vy -= 30 * dt; w.x += w.vx * dt; w.y += w.vy * dt; w.spin += w.vx * 90 * dt;
    if (w.y <= 0) { w.y = 0; w.vy = w.vy < -2 ? -w.vy * .3 : 0; w.vx *= .6; }
  }
}

// ---------------- perigos e colisões ----------------
function hazards() {
  const b = playerBox(), M = .45, inv = R.inv > 0;
  for (const s of R.segs) {
    if (s.x + s.def.w < b.x0 - 3 || s.x > b.x1 + 3) continue;
    s.def.zaps.forEach((z, i) => {
      if (dead()) return;
      const e = zapEnds(z, s.x, R.t);
      if (!inv && capsuleHits(e, ZR, b)) { hit("zap", null); return; }
      const bit = 1 << i;
      if (s.nearMask & bit || inv) return;
      const nb = { x0: b.x0 - M, x1: b.x1 + M, y0: b.y0 - M, y1: b.y1 + M };
      if (capsuleHits(e, ZR, nb) && b.x0 > Math.max(e[0], e[2]) + ZR) { s.nearMask |= bit; nearMiss(); }
    });
    if (dead()) return;
  }
  for (const m of R.missiles) {
    if (m.ph !== "fly" || m.near) continue;
    if (m.x + .45 < b.x0) { m.near = true; const gap = Math.max(m.y - .175 - b.y1, b.y0 - (m.y + .175)); if (gap < M * 2) nearMiss(); }
  }
  if (inv) return;
  const L = R.laser;
  if (L && L.ph === "fire") for (const row of L.waves[L.i]) if (b.y0 < row + LH && b.y1 > row - LH) { hit("laser", null); return; }
  for (const m of R.missiles) if (m.ph === "fly" && overlap(missileBox(m), b)) { hit("drone", m); return; }
}
function nearMiss() { addCtr("near"); SFX.near(); floatText("raspão!", "#7df9ff"); }
function hit(cause, m) {
  if (m) m.ph = "gone";
  if (!R.veh) { kill(cause); return; }
  if (cause === "drone" && R.veh.hp > 1) { R.veh.hp--; R.inv = .5; boom(12); shake(.15, .15); SFX.bonk(); return; }
  const y = R.veh.y; R.veh = null;
  R.y = clamp(y, 0, MAXY); R.vy = 8; R.st = "fall"; R.inv = R.cfg.shield;
  boom(50); shake(.35, .3); SFX.boom();
}

// ---------------- missões e progresso ----------------
function missionCurrent(a) {
  const m = missionById[a.id]; if (a.done) return m.target;

  return m.scope === "run" ? run : a.prog + run;
}
function missionLiveCheck(silent) {
  if (!R) return;
  for (const a of PF.active) {
    if (a.done) continue;
    const m = missionById[a.id];
    if (missionCurrent(a) >= m.target) { a.done = true; if (!silent) { popup("✓ " + mText(m) + " " + "★".repeat(m.stars)); SFX.mission(); } }

}
function finishMissions(report) {

  for (let k = Math.floor(par / sp) - 1; k < (par + W / SC) / sp + 2; k++) {
    const wx = k * sp - par + camX;
    ctx.fillStyle = "#3a4180"; ctx.fillRect(sx(wx) - .3 * SC, sy(P.ceil), .6 * SC, sy(0) - sy(P.ceil));
    ctx.fillStyle = "rgba(125,249,255,.07)"; ctx.fillRect(sx(wx + 3) - SC, sy(5.6), 2 * SC, 1.2 * SC);
    ctx.fillStyle = "rgba(255,210,63,.12)"; ctx.fillRect(sx(wx + 3) - .9 * SC, sy(5.5), .4 * SC, .2 * SC);
  }
  // esteira ao fundo
  ctx.fillStyle = "#262c5c"; ctx.fillRect(0, sy(1.4), W, .25 * SC);
  // teto e chão com faixa de segurança
  ctx.fillStyle = "#1b1f3b"; ctx.fillRect(0, 0, W, sy(P.ceil)); ctx.fillRect(0, sy(0), W, H - sy(0));
  const stripe = .5 * SC, off = ((camX * SC) % (stripe * 2) + stripe * 2) % (stripe * 2);
  for (const yy of [sy(0), sy(P.ceil) - .18 * SC]) {
    ctx.save(); ctx.beginPath(); ctx.rect(0, yy, W, .18 * SC); ctx.clip();
    ctx.fillStyle = "#ffd23f"; ctx.fillRect(0, yy, W, .18 * SC); ctx.fillStyle = "#1b1f3b";
    for (let x = -off - stripe * 2; x < W + stripe * 2; x += stripe * 2) { ctx.beginPath(); ctx.moveTo(x, yy + .18 * SC); ctx.lineTo(x + stripe, yy); ctx.lineTo(x + stripe * 1.6, yy); ctx.lineTo(x + stripe * .6, yy + .18 * SC); ctx.fill(); }
    ctx.restore();
  }
  // marcos a cada 10 m
  ctx.fillStyle = "#a8aec9"; ctx.font = `700 ${Math.max(10, .28 * SC)}px Nunito, sans-serif`; ctx.textAlign = "center";
  for (let m = Math.max(0, Math.floor(camX / 10) * 10); m < camX + W / SC + 10; m += 10) {
    ctx.fillRect(sx(m) - 1, sy(0) + .2 * SC, 2, .35 * SC);
    ctx.fillText(m + " m", sx(m), sy(0) + .85 * SC);
  }
  if (PF.best > 20) { const bx = sx(PF.best); if (bx > -50 && bx < W + 50) { ctx.fillStyle = "#ffd23f"; ctx.fillRect(bx - 2, sy(P.ceil), 4, sy(0) - sy(P.ceil)); ctx.fillText("RECORDE", bx, sy(P.ceil) + .5 * SC); } }
}

function drawNut(x, y, r, c) {
  ctx.fillStyle = c; ctx.beginPath();
  for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i + Math.PI / 6; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#1b1f3b"; ctx.beginPath(); ctx.arc(x, y, r * .42, 0, 7); ctx.fill();
}

function drawWorld() {
  const t = R.t;
  // água do Jet-Esqui
  if (R.veh && R.veh.kind === "ski") { ctx.fillStyle = "rgba(30,144,255,.35)"; ctx.fillRect(0, sy(WATER), W, sy(0) - sy(WATER)); }
  // robôs operários
  for (const w of R.workers) {
    const x = sx(w.x), y = sy(w.y + .5);
    ctx.save(); ctx.translate(x, y); ctx.rotate(w.spin * Math.PI / 180);
    const bob = w.down ? 0 : Math.abs(Math.sin(performance.now() / 120 + w.id)) * .05 * SC;
    ctx.fillStyle = "#8e9aaf"; roundRect(-.3 * SC, -.5 * SC - bob, .6 * SC, .8 * SC, .1 * SC); ctx.fill();
    ctx.fillStyle = w.down ? "#e71d36" : "#ffd23f"; ctx.fillRect((w.dir * .05 - .17) * SC, -.38 * SC - bob, .34 * SC, .12 * SC);
    ctx.fillStyle = "#5b6585"; ctx.fillRect(-.22 * SC, .3 * SC, .12 * SC, .2 * SC); ctx.fillRect(.1 * SC, .3 * SC, .12 * SC, .2 * SC);
    ctx.restore();
  }
  // arcos de faísca
  for (const s of R.segs) s.def.zaps.forEach((z, i) => {
    const e = zapEnds(z, s.x, t);
    const ax = sx(e[0]), ay = sy(e[1]), bx = sx(e[2]), by = sy(e[3]);
    if (Math.max(ax, bx) < -50 || Math.min(ax, bx) > W + 50) return;
    ctx.save();
    ctx.strokeStyle = z.om ? "#ffb86b" : "#7df9ff"; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 14;
    ctx.lineWidth = Math.max(2, .12 * SC); ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(ax, ay);
    const n = 7;
    for (let k = 1; k < n; k++) { const f = k / n, j = (Math.random() - .5) * .35 * SC; ctx.lineTo(ax + (bx - ax) * f + j * (ay - by) / (Math.hypot(bx - ax, by - ay) || 1), ay + (by - ay) * f + j * (bx - ax) / (Math.hypot(bx - ax, by - ay) || 1)); }
    ctx.lineTo(bx, by); ctx.stroke(); ctx.restore();
    for (const [cx, cy] of [[ax, ay], [bx, by]]) { ctx.fillStyle = "#a8aec9"; ctx.beginPath(); ctx.arc(cx, cy, .3 * SC, 0, 7); ctx.fill(); ctx.fillStyle = "#1b1f3b"; ctx.beginPath(); ctx.arc(cx, cy, .13 * SC, 0, 7); ctx.fill(); }
  });
  // coletáveis
  for (const p of R.picks) {
    if (p.got) continue; const x = sx(p.x), y = sy(p.y); if (x < -40 || x > W + 40) continue;
    if (p.k === "coin") drawNut(x, y, .2 * SC, "#ffd23f");
    else if (p.k === "tok") { ctx.fillStyle = "#b388ff"; ctx.beginPath(); ctx.arc(x, y, .32 * SC, 0, 7); ctx.fill(); ctx.strokeStyle = "#f6f7fb"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, .22 * SC, 0, 7); ctx.stroke(); ctx.fillStyle = "#f6f7fb"; ctx.font = `${.3 * SC}px "Lilita One", sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("F", x, y + 1); }
    else { ctx.save(); ctx.translate(x, y); ctx.rotate(t * 1.5); ctx.fillStyle = "#ff9f1c"; roundRect(-.35 * SC, -.35 * SC, .7 * SC, .7 * SC, .1 * SC); ctx.fill(); ctx.fillStyle = "#1b1f3b"; ctx.font = `${.45 * SC}px "Lilita One", sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("?", 0, 2); ctx.restore(); }
  }
  ctx.textBaseline = "alphabetic";
}

function drawPlayer() {
  const blink = R.inv > 0 && Math.floor(performance.now() / 60) % 2 === 0;
  // partículas do jato
  for (const p of R.parts) {
    const a = 1 - p.t / p.life; ctx.globalAlpha = a; ctx.fillStyle = p.c;
    if (p.bubble) { ctx.strokeStyle = p.c; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), p.s * SC, 0, 7); ctx.stroke(); }
    else ctx.fillRect(sx(p.x) - p.s * SC / 2, sy(p.y) - p.s * SC / 2, p.s * SC, p.s * SC);
  }
  ctx.globalAlpha = 1;
  if (blink) return;
  const outfit = (itemById[PF.eq.outfit] || itemById.macacao_verde).c[0];
  if (R.veh) { drawVehicle(R.veh, outfit); return; }
  const x = sx(R.x), y = sy(R.y);
  ctx.save(); ctx.translate(x, y);
  let rot = 0, bob = 0;
  if (R.st === "ground") bob = Math.abs(Math.sin(R.t * R.vx * 1.2)) * .06 * SC;
  else if (R.st === "thrust" || R.st === "fall") rot = R.vy * 1.2 * Math.PI / 180;
  else if (R.st === "dead") rot = R.t * 12;
  else rot = Math.PI / 2;
  ctx.translate(0, -.5 * SC - bob); ctx.rotate(rot);
  // mochila-propulsor (extintor)
  ctx.fillStyle = "#e71d36"; roundRect(-.52 * SC, -.32 * SC, .28 * SC, .55 * SC, .1 * SC); ctx.fill();
  ctx.fillStyle = "#ff9f1c"; ctx.fillRect(-.48 * SC, .2 * SC, .2 * SC, .1 * SC);
  // corpo (macacão)
  ctx.fillStyle = outfit; roundRect(-.27 * SC, -.5 * SC, .54 * SC, 1 * SC, .14 * SC); ctx.fill();
  // rosto e óculos de solda
  ctx.fillStyle = "#f2c9a0"; roundRect(-.2 * SC, -.46 * SC, .42 * SC, .3 * SC, .08 * SC); ctx.fill();
  ctx.fillStyle = "#1b1f3b"; ctx.fillRect(-.05 * SC, -.4 * SC, .3 * SC, .09 * SC);
  ctx.fillStyle = "#7df9ff"; ctx.fillRect(.12 * SC, -.39 * SC, .08 * SC, .06 * SC);
  // cabelo e acessório
  ctx.fillStyle = "#5a2d1a"; ctx.fillRect(-.24 * SC, -.52 * SC, .44 * SC, .1 * SC);
  if (PF.eq.hat) { ctx.fillStyle = itemById[PF.eq.hat].c[0]; roundRect(-.26 * SC, -.64 * SC, .52 * SC, .16 * SC, .07 * SC); ctx.fill(); if (PF.eq.hat === "bone") ctx.fillRect(-.42 * SC, -.52 * SC, .2 * SC, .06 * SC); }
  // cinto de ferramentas
  ctx.fillStyle = "#1b1f3b"; ctx.fillRect(-.27 * SC, .1 * SC, .54 * SC, .07 * SC);
  ctx.restore();
}

function drawVehicle(v, outfit) {
  const d = VEH[v.kind], x = sx(R.x), y = sy(v.y);
  ctx.save(); ctx.translate(x, y - v.h * SC / 2);
  if (v.kind === "flip" && v.sign > 0) ctx.scale(1, -1);
  const tilt = ["drone", "mech", "bike", "rig"].includes(v.kind) ? -v.vy * 1.5 : v.kind === "serpent" ? Math.sin(R.t * 6) * 6 : 0;
  ctx.rotate(tilt * Math.PI / 180);
  const w = v.w * SC, h = v.h * SC;
  ctx.fillStyle = v.kind === "rig" ? ["#6e6a5a", "#b8993a", "#ffd23f"][clamp(v.hp, 1, 3) - 1] : d.color; // blindagem escurece
  roundRect(-w / 2, -h / 2, w, h, .18 * SC); ctx.fill();
  // detalhes por tipo
  ctx.fillStyle = "rgba(0,0,0,.25)";
  if (v.kind === "mech" || v.kind === "rig") { ctx.fillRect(-w * .35, h * .3, w * .2, h * .2); ctx.fillRect(w * .15, h * .3, w * .2, h * .2); }
  if (v.kind === "drone") { ctx.fillRect(-w * .6, -h * .55, w * 1.2, h * .12); }
  if (v.kind === "bike" || v.kind === "ski") { ctx.fillStyle = "#1b1f3b"; ctx.beginPath(); ctx.arc(-w * .3, h * .45, h * .25, 0, 7); ctx.arc(w * .3, h * .45, h * .25, 0, 7); ctx.fill(); }
  // cabine com a Nina
  ctx.fillStyle = outfit; ctx.beginPath(); ctx.arc(w * .15, -h * .18, .25 * SC, 0, 7); ctx.fill();
  ctx.fillStyle = "#1b1f3b"; ctx.fillRect(w * .15, -h * .22, .2 * SC, .07 * SC);
  ctx.restore();
  if (v.kind === "blink") {
    const a = blinkAngle(v) * Math.PI / 180, cx = x, cy = y - v.h * SC / 2;
    ctx.strokeStyle = "#ffd23f"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * 1.6 * SC, cy - Math.sin(a) * 1.6 * SC); ctx.stroke();
  }
}

function drawHazardsTop() {
  // drones e avisos
  for (const m of R.missiles) {
    if (m.ph === "fly") {
      const x = sx(m.x), y = sy(m.y);
      ctx.fillStyle = "#e71d36"; roundRect(x - .45 * SC, y - .17 * SC, .9 * SC, .34 * SC, .17 * SC); ctx.fill();
      ctx.fillStyle = "#a8aec9"; ctx.fillRect(x + .2 * SC, y - .3 * SC, .15 * SC, .6 * SC);
      ctx.fillStyle = "#ff9f1c"; ctx.fillRect(x + .45 * SC, y - .08 * SC, rr(.2, .45) * SC, .16 * SC);
    } else if (m.ph === "track" || m.ph === "lock") {
      const hz = m.ph === "lock" ? 10 : 4;
      if (Math.floor(performance.now() / 1000 * hz * 2) % 2 === 0) {
        const x = W - .8 * SC, y = sy(m.y);
        ctx.fillStyle = "#e71d36"; ctx.beginPath(); ctx.moveTo(x, y - .35 * SC); ctx.lineTo(x + .38 * SC, y + .3 * SC); ctx.lineTo(x - .38 * SC, y + .3 * SC); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#f6f7fb"; ctx.font = `${.4 * SC}px "Lilita One", sans-serif`; ctx.textAlign = "center"; ctx.fillText("!", x, y + .22 * SC);
      }
    }
  }
  // feixes de corte
  const L = R.laser;
  if (L) {
    const slide = L.ph === "enter" ? L.t / LT.enter : L.ph === "leave" ? 1 - L.t / LT.leave : 1;
    const inset = lerp(-.6, .3, slide) * SC;
    const rows = (L.ph === "warn" || L.ph === "fire") ? L.waves[L.i] : L.waves[Math.min(L.i, L.waves.length - 1)];
    for (const row of rows) {
      const y = sy(row);
      if (L.ph === "fire") { ctx.save(); ctx.shadowColor = "#e71d36"; ctx.shadowBlur = 20; ctx.fillStyle = "#ff4d63"; ctx.fillRect(0, y - LH * SC, W, LH * 2 * SC); ctx.fillStyle = "#fff"; ctx.fillRect(0, y - .05 * SC, W, .1 * SC); ctx.restore(); }
      else if (L.ph === "warn" && Math.floor(performance.now() / 80) % 2 === 0) { ctx.fillStyle = "rgba(231,29,54,.8)"; ctx.fillRect(0, y - 1.5, W, 3); }
      ctx.fillStyle = "#a8aec9"; roundRect(inset - .4 * SC, y - .3 * SC, .8 * SC, .6 * SC, .1 * SC); ctx.fill(); roundRect(W - inset - .4 * SC, y - .3 * SC, .8 * SC, .6 * SC, .1 * SC); ctx.fill();
    }
  }
  // textos flutuantes
  for (const f of R.floats) {
    const b = playerBox(); ctx.globalAlpha = 1 - f.t / .7; ctx.fillStyle = f.c; ctx.font = `${.42 * SC}px "Lilita One", sans-serif`; ctx.textAlign = "center";
    ctx.fillText(f.text, sx((b.x0 + b.x1) / 2), sy(b.y1 + .4 + f.t)); ctx.globalAlpha = 1;
  }
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  let ox = 0, oy = 0;
  if (shakeT > 0) { const k = shakeA * SC * (shakeT / shakeD); ox = rr(-k, k); oy = rr(-k, k); }
  camX = R.x - .22 * W / SC;
  ctx.save(); ctx.translate(ox, oy);
  drawBackground(); drawWorld(); drawPlayer(); drawHazardsTop();
  ctx.restore();
}

function updateHud() {
  const d = Math.floor(R.x);
  $("dist").textContent = fmt(d) + " m";
  $("dist").classList.toggle("record", PF.best > 0 && d > PF.best);
  $("best").textContent = PF.best > 0 ? "melhor " + fmt(PF.best) + " m" : "";
  $("coinN").textContent = fmt(R.coins);
  const ch = canHead(); show("btnHead", ch); if (ch) $("btnHead").textContent = `ARRANCADA (x${cnt("arrancada")})`;
  if (state === "countdown") $("countdown").textContent = Math.max(1, Math.ceil((.9 - stateT) / .3));
  if (state === "revive") $("reviveBar").style.width = Math.max(0, (1 - stateT / 4) * 100) + "%";
}

// ---------------- laço principal ----------------
let last = performance.now(), accum = 0;
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  stateT += dt;
  if (shakeT > 0) shakeT -= dt;
  tickPopup(dt);

  if (state === "intro" && stateT >= .8) setState("run");
  if (state === "countdown" && stateT >= .9) setState("run");
  if (state === "revive" && stateT >= 4) { R.declined = true; toClawOrResults(); }

  const sim = state === "intro" || state === "run" || state === "dying" || state === "menu";
  if (sim) {
    accum += dt;
    while (accum >= DT) {
      const control = state === "run";
      if (state === "menu") { /* cena parada atrás do menu */ }
      else step(DT, control && held, control && pressedLatch);
      pressedLatch = false; accum -= DT;
    }
  } else accum = 0;

  render();
  updateHud();
  requestAnimationFrame(frame);
}

resize();
newRun();
setState("menu");
requestAnimationFrame(frame);
</script>
